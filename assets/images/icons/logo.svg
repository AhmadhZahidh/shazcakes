<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80" aria-label="Shaz Cakes &amp; Surprises">
  <defs>
    <linearGradient id="roseGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C84376" />
      <stop offset="50%" stop-color="#E86A9A" />
      <stop offset="100%" stop-color="#D9B779" />
    </linearGradient>
    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D9B779" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#D9B779" stop-opacity="1" />
      <stop offset="100%" stop-color="#D9B779" stop-opacity="0.2" />
    </linearGradient>
  </defs>
  
  <!-- Subtle decorative spark / star -->
  <path d="M 175 14 Q 177 20 183 22 Q 177 24 175 30 Q 173 24 167 22 Q 173 20 175 14 Z" fill="#D9B779" opacity="0.9" />
  <circle cx="187" cy="16" r="1.5" fill="#E86A9A" />

  <!-- Main Brand Name: Shaz -->
  <text x="24" y="46" font-family="'Playfair Display', 'Cinzel', 'Georgia', serif" font-size="44" font-weight="700" letter-spacing="1.5" fill="#382632">
    Shaz
  </text>
  
  <!-- Subtle Heart / Spark flourish on the S -->
  <circle cx="20" cy="18" r="2.5" fill="#E86A9A" opacity="0.85" />
  
  <!-- Divider line with gold champagne gradient -->
  <line x1="24" y1="55" x2="260" y2="55" stroke="url(#goldGlow)" stroke-width="1.2" stroke-linecap="round" />
  
  <!-- Subtitle: CAKES & SURPRISES -->
  <text x="26" y="69" font-family="'Montserrat', 'Century Gothic', -apple-system, sans-serif" font-size="10.5" font-weight="600" letter-spacing="4.8" fill="#C84376">
    CAKES &amp; SURPRISES
  </text>
</svg>
